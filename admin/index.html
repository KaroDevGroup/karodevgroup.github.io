<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DaBoyzApp | Admin Portal</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <div class="background-grid"></div>

    <div class="red-glow glow-left"></div>
    <div class="red-glow glow-right"></div>


    <nav class="admin-navbar">

        <a href="/" class="brand">
            <span class="brand-red">DA</span>BOYZAPP
        </a>

        <a href="/" class="back-button">
            ← Back to Website
        </a>

    </nav>


    <main class="login-wrapper">

        <div class="login-card">

            <div class="login-header">

                <p class="portal-label">
                    RESTRICTED ACCESS
                </p>

                <h1>
                    Admin Portal
                </h1>

                <p class="login-description">
                    Sign in using your DaBoyzApp administrator account.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="admin@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <p
                    id="loginError"
                    class="login-error"
                ></p>


                <button
                    type="submit"
                    class="login-button"
                >
                    SIGN IN
                </button>

            </form>


            <div class="security-note">

                <span class="status-dot"></span>

                Secure administrator authentication

            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>

</body>

</html>
